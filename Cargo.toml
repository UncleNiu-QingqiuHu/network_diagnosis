[workspace]
resolver = "2"
members = ["crates/qqhu-core", "crates/qqhu-sys", "crates/qqhu-probe", "crates/qqhu-report", "crates/qqhu-pki", "src-tauri"]

[workspace.package]
version = "4.0.0-alpha.10"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Mr. Z <mr.zed@qq.com>"]
repository = "https://github.com/UncleNiu-QingqiuHu/network_diagnosis"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "io-util", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
sha2 = "0.11"
x509-parser = "0.18"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
socket2 = "0.6"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
p12 = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
