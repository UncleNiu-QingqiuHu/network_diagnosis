[workspace]
resolver = "2"
members = ["crates/qqhu-core", "crates/qqhu-sys", "crates/qqhu-probe", "crates/qqhu-report", "src-tauri"]

[workspace.package]
version = "4.0.0-alpha.3"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["Mr. Z <mr.zed@qq.com>"]
repository = "https://github.com/UncleNiu-QingqiuHu/network_diagnosis"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "process", "io-util", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
