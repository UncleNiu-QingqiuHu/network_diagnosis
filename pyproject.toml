[project]
name = "qqhu-network-diagnosis"
dynamic = ["version"]
description = "Windows 桌面网络诊断工具（设计文档 v1.4）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ttkbootstrap>=1.10.1",
    "paramiko>=3.4,<4",
    "pyserial>=3.5",
]

[project.entry-points.gui_scripts]
network-diagnosis = "network_diagnosis.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.dynamic]
version = {attr = "network_diagnosis.version.APP_VERSION"}

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["network_diagnosis"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
