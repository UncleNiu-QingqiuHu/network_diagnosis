[project]
name = "qqhu-network-diagnosis"
dynamic = ["version"]
description = "青丘狐网络工作台：Windows 桌面连通性诊断、安全诊断（基线）、子网计算、交换机 Console、数据库诊断等（设计文档 v1.5）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ttkbootstrap>=1.20.3",
    "paramiko>=5.0.0",
    "pyserial>=3.5",
    "pymysql>=1.1.3",
    "psycopg[binary]>=3.3.4",
    "pyodbc>=5.3.0",
    "oracledb>=4.0.0",
]

[project.entry-points.gui_scripts]
network-diagnosis = "network_diagnosis.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.dynamic]
version = {attr = "network_diagnosis.version.APP_VERSION"}

[tool.setuptools.package-data]
network_diagnosis = ["images/*"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["network_diagnosis"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
