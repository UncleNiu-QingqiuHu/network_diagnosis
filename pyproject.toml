[project]
name = "qqhu-network-diagnosis"
version = "0.1.0"
description = "Windows 桌面网络诊断工具（设计文档 v1.4）"
readme = "ThirdParty/README.md"
requires-python = ">=3.10"
dependencies = [
    "ttkbootstrap>=1.10.1",
]

[project.scripts]
network-diagnosis = "network_diagnosis.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["network_diagnosis"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
